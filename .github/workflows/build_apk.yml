name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.DAFTAR_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/daftar-release.p12"
            echo "DAFTAR_KEYSTORE_PATH=$RUNNER_TEMP/daftar-release.p12" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        timeout-minutes: 25
        env:
          DAFTAR_KEYSTORE_PASSWORD: ${{ secrets.DAFTAR_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm -v

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath daftar-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: daftar-windows-x64
          path: daftar-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: daftar-windows-x64
          path: dist
      - name: Name the files with the version
        run: |
          V="${GITHUB_REF_NAME}"
          mv dist/app-arm64-v8a-release.apk "dist/Daftar-${V}.apk"
          mv dist/app-armeabi-v7a-release.apk "dist/Daftar-${V}-32bit.apk"
          mv dist/daftar-windows-x64.zip "dist/Daftar-${V}-windows-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
