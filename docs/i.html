<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>فاتورة</title>
<style>
:root{--g:#0F766E;--m:#12B886;--bg:#F3F7F6;--t:#10211F}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
.w{max-width:640px;margin:0 auto;padding:16px}
.c{background:#fff;border-radius:16px;box-shadow:0 1px 8px #0001;overflow:hidden}
.h{background:linear-gradient(135deg,var(--g),var(--m));color:#fff;padding:20px}
.h h1{margin:0;font-size:20px}.h p{margin:4px 0 0;opacity:.9;font-size:14px}
.b{padding:16px}.r{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:14px}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
th{background:#E6F4F1;text-align:right;padding:8px}td{padding:8px;border-bottom:1px solid #0001}
.n{text-align:left;white-space:nowrap;direction:ltr}
.tot{font-weight:800;font-size:18px;color:var(--g);border-top:2px solid var(--m);margin-top:6px;padding-top:10px}
.rem{color:#B45309;font-weight:700}.paid{color:#15803D;font-weight:700}
button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--g);color:#fff;font-size:16px}
.f{text-align:center;font-size:12px;opacity:.6;margin:14px 0}
@media print{button,.f{display:none}body{background:#fff}.c{box-shadow:none}}
</style></head><body><div class="w"><div class="c" id="c"><div class="b" id="m">جارٍ التحميل...</div></div>
<div class="f">أُنشئت بتطبيق دفتر</div></div>
<script>
const U="https://byxugbmxtwvorepmecdz.supabase.co",K="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5eHVnYm14dHd2b3JlcG1lY2R6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzMDMxMjQsImV4cCI6MjExMDg3OTEyNH0.dmFN5ppC_x551fktcJqraz86EWjXazJgwBJJbxgLUSA";
const tok=(location.hash||"").slice(1)||new URLSearchParams(location.search).get("t")||"";
const fmt=n=>Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const dt=ms=>ms?new Date(ms).toLocaleDateString("ar-SA-u-nu-latn",{year:"numeric",month:"long",day:"numeric"}):"";
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function row(p,a,b,c){const r=el("div","r "+(c||""));r.append(el("span","",a),el("span","n",b));p.append(r)}
async function go(){
  const box=document.getElementById("c");
  if(!/^[0-9a-f]{16,64}$/.test(tok)){box.replaceChildren(el("div","b","الرابط غير صالح"));return}
  let s;
  try{
    const r=await fetch(U+"/rest/v1/rpc/open_share",{method:"POST",headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json","Content-Profile":"daftar"},body:JSON.stringify({p_token:tok})});
    s=await r.json();
  }catch(e){box.replaceChildren(el("div","b","تعذر التحميل، تحقق من الاتصال"));return}
  if(!s){box.replaceChildren(el("div","b","هذا الرابط لم يعد متاحاً"));return}
  const cur=s.currency||"";
  document.title=(s.label||"فاتورة")+" "+s.number;
  const h=el("div","h");h.append(el("h1","",(s.label||"فاتورة")+" "+s.number));
  if(s.company)h.append(el("p","",s.company));
  const b=el("div","b");
  row(b,"التاريخ",dt(s.date));
  if(s.due)row(b,"الاستحقاق",dt(s.due));
  if(s.party)row(b,"العميل",s.party);
  const t=el("table"),th=el("tr");
  ["الصنف","الكمية","السعر","الإجمالي"].forEach(x=>th.append(el("th","",x)));t.append(th);
  (s.items||[]).forEach(i=>{const tr=el("tr");tr.append(el("td","",i.d),el("td","n",fmt(i.q).replace(/\.00$/,"")+(i.u?" "+i.u:"")),el("td","n",fmt(i.p)),el("td","n",fmt(i.t)));t.append(tr)});
  b.append(t);
  row(b,"المجموع",fmt(s.subtotal)+" "+cur);
  if(s.vat>0)row(b,"ضريبة القيمة المضافة "+s.vat+"%",fmt(s.vatAmount)+" "+cur);
  row(b,"الإجمالي",fmt(s.total)+" "+cur,"tot");
  if(s.paid>0)row(b,"المدفوع",fmt(s.paid)+" "+cur,"paid");
  if(s.remaining>0.005)row(b,"المتبقي",fmt(s.remaining)+" "+cur,"rem");
  else if(s.total>0)row(b,"الحالة","مسددة","paid");
  if(s.notes)b.append(el("p","",s.notes));
  const p=el("button","","طباعة / حفظ PDF");p.onclick=()=>print();b.append(p);
  box.replaceChildren(h,b);
}
go();
</script></body></html>
